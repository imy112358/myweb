<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./my-site/">
  <title>Redirecting to My Site</title>
  <link rel="canonical" href="./my-site/">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #242933;
      background: #f6f7fb;
    }

    main {
      width: min(92vw, 420px);
      padding: 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #e6e8ef;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(30, 41, 59, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 700;
    }

    p {
      margin: 0 0 22px;
      color: #667085;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      color: #fff;
      text-decoration: none;
      background: #4f46e5;
      border-radius: 8px;
    }
  </style>
  <script>
    window.location.replace("./my-site/");
  </script>
</head>
<body>
  <main>
    <h1>Redirecting to My Site</h1>
    <p>If the page does not redirect automatically, use the button below.</p>
    <a href="./my-site/">Enter Home</a>
  </main>
</body>
</html>
